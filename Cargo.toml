[package]
name = "cut-deck"
version = "0.9.5"
edition = "2021"
license = "CC0-1.0"

[dependencies]
anyhow = "1"
cpal = "0.15"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
rtrb = "0.3"
font8x8 = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = { version = "3", features = ["termination"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Linux only: reading devices directly, ALSA MIDI, and JACK as a sound option.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.15", features = ["jack"] }
evdev = "0.12"
libc = "0.2"
alsa = "0.9"
# LAME builds with a Unix configure script; Windows needs another way (stage 1).
mp3lame-encoder = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 2
