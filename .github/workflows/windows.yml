# Windows test builds while the Windows version is being made. Every push to the
# `windows` branch builds CUT for Windows and keeps a zip to download from the run's page
# (Summary > Artifacts), then runs the tests there too.
name: Windows build

on:
  push:
    branches: [windows]
  workflow_dispatch:

jobs:
  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          NAME="cut-windows-${GITHUB_SHA::7}"
          mkdir "$NAME"
          cp target/release/cut-deck.exe README.md CHANGELOG.md LICENSE "$NAME/"
          cp assets/fonts/OFL.txt "$NAME/FONT-LICENSE.txt"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}

      - name: Tests
        run: cargo test --release --locked
